                    <h2>Contact Us</h2>
                    <div class="row mb-4">
                        <div class="col-md-6 border shadow p-3 mb-5 bg-body-tertiary rounded">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="exampleFormControlInput1" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="exampleFormControlInput1"
                                            placeholder=" Enter Name">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="exampleFormControlInput1" class="form-label">Email address</label>

                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="exampleFormControlInput1" class="form-label">Number</label>
                                        <input type="number" class="form-control" id="exampleFormControlInput1"
                                            placeholder="Enter Number">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="exampleFormControlInput1" class="form-label">Enter Subject</label>
                                        <input type="email" class="form-control" id="exampleFormControlInput1"
                                            placeholder="Enter Subject">
                                    </div>
                                </div>
                            </div>

                            <div class="row" mb-5>
                                <div class="col-md-4">
                                    <label for="exampleFormControlInput1" class="form-label">Country</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option selected>Choose..</option>
                                        <option value="1">us</option>
                                        <option value="2">swizarland</option>
                                        <option value="3">paris</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="exampleFormControlInput1" class="form-label">State</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option selected>Choose...</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="exampleFormControlInput1" class="form-label">City</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option selected>Choose..</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <div class="mb-3">
                                        <label for="exampleFormControlTextarea1" class="form-label">
                                            Message</label>
                                        <textarea class="form-control" id="exampleFormControlTextarea1"
                                            rows="3"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
